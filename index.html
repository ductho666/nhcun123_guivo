<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- NOTE: BẠN CÓ THỂ ĐỔI TIÊU ĐỀ TRANG WEB TẠI DÒNG DƯỚI NÀY NHA -->
    <title>Gửi vo dau ❤️</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; height: 100vh; display: flex; justify-content: center; align-items: center; background-color: #fce4ec; overflow: hidden; font-family: sans-serif; position: relative; touch-action: manipulation; }
        .sparkle-touch { position: absolute; width: 8px; height: 8px; background: #fff; border-radius: 50%; pointer-events: none; z-index: 100; box-shadow: 0 0 10px #fff, 0 0 20px #ff85a2; animation: sparkleFade 0.8s forwards; }
        @keyframes sparkleFade { 0% { transform: scale(1) translate(0, 0); opacity: 1; } 100% { transform: scale(0) translate(var(--mx), var(--my)); opacity: 0; } }
        
        /* MÀN HÌNH KHÓA NGANG CHUẨN MẪU */
        .lock-screen { display: flex; width: 680px; height: 380px; background: #ff85a2; border-radius: 20px; padding: 20px; gap: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.15); z-index: 40; transition: all 0.6s ease; }
        .lock-left { flex: 1.1; background: #fff; border-radius: 15px; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        .lock-left img { width: 100%; height: 100%; object-fit: cover; }
        .lock-right { flex: 0.9; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; }
        .pass-dots { display: flex; gap: 15px; margin: 15px 0; }
        .dot { width: 12px; height: 12px; border: 2px solid white; border-radius: 50%; transition: 0.2s; }
        .dot.active { background: white; }
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .key { width: 65px; height:60px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.4); background: rgba(255,255,255,0.1); color: white; font-size: 18px; display: flex; justify-content: center; align-items: center; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        /* Tự vẽ hình khối dẹt bo góc TÔ RUỘT MÀU TRẮNG ĐẶC căng tròn vừa vặn phím số */
        /* Khối chứa biểu tượng xóa - Xóa sạch nền trắng, chỉ giữ icon màu trắng tinh như clip gốc */
        .backspace-icon {
            display: inline-block;
            font-family: sans-serif !important;
            font-size: 20px !important; /* Cỡ icon to rõ ràng cân đối với phím số */
            color: #ffffff !important; /* Tô màu trắng tinh khiết đúng chuẩn clip */
            font-weight: normal !important;
            line-height: 1 !important;
            user-select: none;
        }
        /* Xóa sạch cấu trúc vẽ khung cũ */
        .backspace-icon::after {
            content: '⌫' !important; /* Hiện đúng biểu tượng ngôi nhà chứa dấu X màu trắng */
        }
        
        .key:active { background: rgba(255,255,255,0.4); }
        @media(max-width: 700px) {
            .lock-screen { width: 92%; height: auto; min-height: 480px; flex-direction: column; gap: 10px; padding: 15px; }
            .lock-left { height: 180px; width: 100%; } .lock-right { margin-top: 5px; } .keypad { gap: 8px; } .key { width: 44px; height: 44px; font-size: 16px; }
        }
        .main-space { position: absolute; display: none; flex-direction: column; justify-content: center; align-items: center; width: 100%; height: 100%; opacity: 0; transition: opacity 0.6s ease; perspective: 1000px; }
        .envelope-container { position: relative; width: 92vw; max-width: 420px; height: 260px; display: flex; justify-content: center; align-items: center; }
        
        .envelope-wrapper { position: absolute; width: 100%; height: 100%; background-color: #ff4d88; border-radius: 8px; box-shadow: 0 20px 50px rgba(255, 77, 136, 0.25), 0 10px 20px rgba(0,0,0,0.05); cursor: pointer; -webkit-tap-highlight-color: transparent; z-index: 10; transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.6s ease; }
        .envelope-wrapper::before { content: ''; position: absolute; top: 0; width: 0; height: 0; border-top: 130px solid transparent; border-bottom: 130px solid transparent; border-left: 210px solid #ff6699; left: 0; z-index: 12; }
        .envelope-wrapper::after { content: ''; position: absolute; top: 0; width: 0; height: 0; border-top: 130px solid transparent; border-bottom: 130px solid transparent; border-right: 210px solid #ff6699; right: 0; z-index: 12; }
        .env-top { position: absolute; top: 0; left: 0; width: 0; height: 0; border-left: 210px solid transparent; border-right: 210px solid transparent; border-top: 135px solid #ff80aa; z-index: 15; filter: drop-shadow(0 3px 4px rgba(0,0,0,0.12)); transform-origin: top; transition: transform 0.6s ease; }
        .env-bottom { position: absolute; bottom: 0; left: 0; width: 0; height: 0; border-left: 210px solid transparent; border-right: 210px solid transparent; border-bottom: 135px solid #ff3377; z-index: 14; }
        .env-lock { position: absolute; top: 112px; left: 50%; transform: translateX(-50%); width: 44px; height: 44px; background: linear-gradient(135deg, #ff80aa, #d67092); border-radius: 50%; z-index: 16; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.15), inset 0 2px 4px rgba(255,255,255,0.4); animation: heartbeat 1.4s infinite; transition: opacity 0.3s; }
        .env-lock::after { content: '❤️'; font-size: 16px; color: #fff; }
        
        .envelope-wrapper.open { transform: translateY(450px) scale(0.85); opacity: 0; pointer-events: none; }
        .envelope-wrapper.open .env-top { transform: rotateX(180deg); }
        
        /* Căn chuẩn xấp thư tay thuôn dài nằm CHÍNH GIỮA TÂM màn hình */
        .cards-stack {
            position: absolute; width: 88vw; max-width: 380px; height: 330px; 
            top: 48%; left: 50%; transform: translate(-50%, -50%) scale(0.9);
            z-index: 5; display: none; opacity: 0; transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.1), opacity 0.5s ease; pointer-events: none;
        }
        .cards-stack.show { display: block; opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto; z-index: 25; }
        
        .letter-container {
            position: absolute; width: 100%; height: 100%; background: #fffdf9; 
            background-image: linear-gradient(rgba(224, 75, 107, 0.09) 1px, transparent 1px); background-size: 100% 32px; 
            border-radius: 5px; padding: 25px 35px; display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1); -webkit-tap-highlight-color: transparent;
        }
        
        .letter-container.layer-back-2 { transform: translate(-10px, -15px) rotate(-3.5deg); opacity: 0.6; z-index: 1; box-shadow: 0 15px 30px rgba(136, 44, 73, 0.12), 0 5px 12px rgba(0,0,0,0.03); }
        .letter-container.layer-back-1 { transform: translate(8px, 6px) rotate(2.5deg); opacity: 0.88; z-index: 2; box-shadow: 0 12px 25px rgba(136, 44, 73, 0.15), 0 4px 10px rgba(0,0,0,0.03); }
        .letter-container.layer-front { transform: translate(0, 0) rotate(0deg); z-index: 3; box-shadow: 0 10px 22px rgba(136, 44, 73, 0.16), 0 4px 8px rgba(0,0,0,0.04); }
        
        .letter-container.layer-front.locked { cursor: not-allowed; } .letter-container.layer-front.unlocked { cursor: pointer; }
        
        .letter-text { 
            color: #ef61c2 !important; 
            font-family: 'Segoe Print', 'Comic Sans MS', cursive !important; 
            font-weight: bold !important; 
            font-size: 15px !important; 
            line-height: 32px !important; 
            margin: 0 !important; 
            text-align: center !important; 
            width: 100% !important; 
            white-space: pre-wrap !important;
            letter-spacing: 0.5px !important; 
            font-style: italic !important; 
            padding: 0 10px !important;
        }
        .page-number { position: absolute; bottom: 15px; right: 25px; font-size: 11px; color: #baaaa1; font-weight: bold; font-family: sans-serif; }
        
        /* ĐÃ SỬA LỖI STK: Khung ảnh mặc định ẩn đi, xóa bỏ hoàn toàn chữ và icon lỗi khi chưa có link */
        .letter-sticker { position: absolute; bottom: 12px; left: 25px; width: 45px; height: 45px; display: none; justify-content: center; align-items: center; user-select: none; z-index: 10; }
        .letter-sticker.active { display: flex; }
        .letter-sticker img { width: 100%; height: 100%; object-fit: contain; }
        
       .close-btn {
            position: absolute !important;
            bottom: 15px !important;
            left: 45% !important; /* Đẩy sang góc trái lá thư đối xứng với số trang */
            transform: none !important;
            font-family: 'Caveat', cursive, sans-serif !important; /* Dùng luôn font viết tay cho đồng bộ */
            font-size: 16px !important;
            font-weight: 700 !important;
            color: rgba(7, 0, 0, 0.85) !important; /* Đổi thành màu trắng mờ tinh tế */
            background: none !important; /* Xóa sạch cái nền màu hồng cũ */
            border: none !important;
            padding: 0 !important;
            cursor: pointer !important;
            display: none;
            box-shadow: none !important;
            z-index: 40 !important;
            transition: 0.2s !important;
        }
        /* Hiệu ứng sáng rõ lên khi di chuột vào chữ */
        .close-btn:hover { color: #ffffff !important; }
        /* ĐÃ SỬA LỖI CHE CHỮ: Đẩy khoảng cách xuống rộng rãi cho chữ hồng hướng dẫn lộ diện hoàn toàn */.close-btn {
            position: absolute; 
            bottom: 25px; 
            left: 50%; 
            transform: translateX(-50%); 
            font-size: 11px; 
            font-weight: bold; 
            background: #ff476c; 
            color: white; 
            border: none; 
            padding: 6px 18px; 
            border-radius: 20px; 
            cursor: pointer; 
            display: none; 
            font-family: sans-serif; 
            box-shadow: 0 4px 12px rgba(255, 71, 108, 0.35); 
            z-index: 40; 
            opacity: 0.7;
        }
        .hint-text {
            margin-top: 65px;
            font-size: 14px !important; /* Tăng chữ to lên một chút cho rõ nhen */
            font-weight: bold;
            text-align: center;
            z-index: 5;
            position: relative;
            /* CÀI LỆNH PHÁT SÁNG & ĐỔI MÀU TỰ ĐỘNG CHUẨN ĐÉT */
            animation: glowRainbow 3s infinite alternate ease-in-out !important;
            letter-spacing: 0.5px;
        }
        /* Khai báo bảng màu hồng lấp lánh tự động luân chuyển mềm mại */
        @keyframes glowRainbow {
            0% {
                color: #c98395;
                text-shadow: 0 0 4px #dc788c, 0 0 10px rgba(216, 157, 169, 0.4);
            }
            50% {
                color: #c17286;
                text-shadow: 0 0 6px #ff7597, 0 0 15px rgba(201, 143, 157, 0.6), 0 0 20px #e19797;
            }
            100% {
                color: #c99fae;
                text-shadow: 0 0 4px #e7d8dd, 0 0 10px rgba(216, 27, 96, 0.4);
            }
        }
        .bg-heart { position: absolute; animation: floatUp 4.5s linear infinite; opacity: 0.6; pointer-events: none; z-index: 1; }
        @keyframes heartbeat { 0%, 100% { transform: scale(1) translateX(-50%); } 50% { transform: scale(1.1) translateX(-45%); } }
        @keyframes floatUp { 0% { transform: translateY(110vh) scale(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(-10vh) scale(1.4) rotate(360deg); opacity: 0; } }
    </style>
</head>
<body>
    <audio id="bgMusic" loop><source src="mattroi.mp3" type="audio/mp3"></audio>
    <div class="lock-screen" id="lockScreen">
        <div class="lock-left">
            <!-- =========================================================================
                 NOTE: THAY LINK ẢNH BẠN GÁI VÀO TRONG DẤU NGOẶC KÉP CỦA "SRC" DƯỚI NÀY NHA
                 ========================================================================= -->
            <img src="https://i.postimg.cc/YqmSjhhj/FB-IMG-1787954596862.jpg" alt="Girlfriend">
        </div>
        <div class="lock-right">
            <h3 style="margin:0 0 5px 0; font-weight: normal; letter-spacing: 1px; font-size: 16px;">Nhập mật khẩu</h3>
            <div class="pass-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
            <div class="keypad">
                <div class="key" onclick="pressKey('1')">1</div><div class="key" onclick="pressKey('2')">2</div><div class="key" onclick="pressKey('3')">3</div>
                <div class="key" onclick="pressKey('4')">4</div><div class="key" onclick="pressKey('5')">5</div><div class="key" onclick="pressKey('6')">6</div>
                <div class="key" onclick="pressKey('7')">7</div><div class="key" onclick="pressKey('8')">8</div><div class="key" onclick="pressKey('9')">9</div>
                <div class="key" style="border:none; background:transparent; pointer-events:none;"></div><div class="key" onclick="pressKey('0')">0</div><div class="key" onclick="pressKey('⌫')"><span class="backspace-icon"></span></div>
            </div>
        </div>
    </div>
    <div class="main-space" id="mainSpace">
        <div class="envelope-container">
            <div class="envelope-wrapper" id="envelope" onclick="openEnvelope()">
                <div class="env-top"></div><div class="env-lock"></div><div class="env-bottom"></div>
            </div>
            <div class="cards-stack" id="cardsStack">
                <div class="letter-container layer-back-2" id="card3"><p class="letter-text"></p><div class="letter-sticker"><img src="" alt="stk"></div><span class="page-number"></span></div>
                <div class="letter-container layer-back-1" id="card2"><p class="letter-text"></p><div class="letter-sticker"><img src="" alt="stk"></div><span class="page-number"></span></div>
                <div class="letter-container layer-front locked" id="card1" onclick="nextPage(event)">
                    <p class="letter-text" id="letterContent"></p>
                    <div class="letter-sticker" id="letterStickerKhung"><img id="stickerImg" src="" alt=""></div>
                    <span class="page-number" id="pageNumber">1/10</span>
                </div>
                <button class="close-btn" id="closeBtn" onclick="closeEnvelope(event)">[back]</button>
            </div>
        </div>
        <div class="hint-text" id="hintText">Chạm vào để mở~ </div>
    </div>
    <script>
        // --- NỘI DUNG 10 TẤM THƯ ---
        const messages = [
            "Gửi vo dau, anh yeu!🍓 ",
            " Moi ngày thức day, dieu đầu tien khiến anh mim cười chính là nghi về em - cô gái ngọt 🍭...",
            "Cảm on em vi đã xuất hiện và chịu đựng một đứa trẻ con như anh.",
            "Em có biet nu cười của em là thu làm anh tan chảy nhanh nhat không?",
            "Du có doi lúc gian hờn, nhưng trong lòng anh luc nào cũng chỉ cos minh em thoi.",
            " Yeu em hon tat ca những lời đường mật trên đời🍓",
            " em khong giỏi môn Địa lý, nhung anh biet chac chan vị trí của em là nam gọn trong tim anh.",
            " Cảm on công chúa nhỏ cua anh vì đã luôn bao dung cho anh nhá.",
            "Thế giới này có hơn 8 tỉ người, nhưng anh chỉ cần một mình em thoi!",
            "Chúc em xinh dep gai tuyet voi luon hanh phuc. Yeu em rat nhiều!"
        ];

        // =========================================================================
        // NOTE: ĐÂY LÀ CHỖ CHỪA SẴN ĐỂ BẠN THAY LINK 10 HÌNH GIF STICKER CHO 10 TRANG.
        // NẾU BẠN CHƯA CÓ LINK THÌ CỨ ĐỂ TRỐNG CẶP NGOẶC KÉP "", CODE SẼ TỰ ĐỘNG ẨN 
        // ĐI ĐỂ KHÔNG BỊ VỠ KHUfNG HÌNH NHỮNG BẢN TRƯỚC NỮA NHEN!
        // =========================================================================
        const stickers = [
            "https://media.giphy.com/media/QiPnft2K0I6dWikbgV/giphy.gif", // Link GIF tấm 1
            "https://media.giphy.com/media/fvN5KrNcKKUyX7hNIA/giphy.gif", // Link GIF tấm 2
            "https://media.giphy.com/media/SvK7Gxcq4QS4fNNjYH/giphy.gif", // Link GIF tấm 3
            "https://media.giphy.com/media/wYzNWKJ2jU4rNX6SAO/giphy.gif", // Link GIF tấm 4
            "http://media.giphy.com/media/m85llaN7ZkFIHtURiC/giphy.gif", // Link GIF tấm 5
            "https://media.giphy.com/media/SbEFIWEUnbmLvppq2S/giphy.gif", // Link GIF tấm 6
            "https://media.giphy.com/media/a6TvNMFAJqfTOAGjz4/giphy.gif", // Link GIF tấm 7
            "https://media.giphy.com/media/c6NVx4nilD9E9HhSDC/giphy.gif", // Link GIF tấm 8
            "https://media.giphy.com/media/SbEFIWEUnbmLvppq2S/giphy.gif", // Link GIF tấm 9
            "https://media.giphy.com/media/kfRKF0iqA8jyDqq1nH/giphy.gif"  // Link GIF tấm 10
        ];

        // NOTE: THAY ĐỔI MẬT KHẨU MỞ WEB TẠI ĐÂY (MẶC ĐỊNH LÀ 1212)
        const CORRECT_PIN = "2411"; 
        
        let currentInput = "", currentPage = 0, isOpened = false, typingTimeout, isTyping = false;

        function typeWriter(text, i) {
            const hint = document.getElementById('hintText'); const frontCard = document.getElementById('card1');
            isTyping = true; frontCard.className = "letter-container layer-front locked"; hint.innerText = "Đợi tí nhá...";
            if (i < text.length) {
                document.getElementById('letterContent').innerHTML = text.substring(0, i + 1);
                typingTimeout = setTimeout(function() { typeWriter(text, i + 1); }, 50);
            } else { 
                isTyping = false; frontCard.className = "letter-container layer-front unlocked"; hint.innerText = "Vuốt ngang để đọc tiếp ~🍓";
                if (currentPage === messages.length - 1) { document.getElementById('closeBtn').style.display = 'block'; }
            }
        }
        function pressKey(num) {
            const dots = document.querySelectorAll('.dot');
            if (num === '⌫') currentInput = currentInput.slice(0, -1); else if (currentInput.length < 4) currentInput += num;
            dots.forEach((dot, idx) => { if (idx < currentInput.length) dot.classList.add('active'); else dot.classList.remove('active'); });
            if (currentInput.length === 4) {
                if (currentInput === CORRECT_PIN) {
                    document.getElementById('bgMusic').play().catch(e => console.log("Music"));
                    document.getElementById('lockScreen').style.transform = 'scale(0.8)'; document.getElementById('lockScreen').style.opacity = '0';
                    setTimeout(() => { document.getElementById('lockScreen').style.display = 'none'; const mainSpace = document.getElementById('mainSpace'); mainSpace.style.display = 'flex'; setTimeout(() => mainSpace.style.opacity = '1', 50); }, 600);
                } else { document.getElementById('lockScreen').style.animation = 'shake 0.3s ease'; setTimeout(() => { document.getElementById('lockScreen').style.animation = ''; currentInput = ""; dots.forEach(dot => dot.classList.remove('active')); }, 300); }
            }
        }
        function openEnvelope() {
            if (!isOpened) {
                document.getElementById('envelope').classList.add('open'); isOpened = true;
                setTimeout(() => {
                    document.getElementById('cardsStack').classList.add('show');
                    updateBackCardsPreview();
                    if(stickers[currentPage] !== "") {
                        document.getElementById('letterStickerKhung').className = "letter-sticker active";
                        document.getElementById('stickerImg').src = stickers[currentPage];
                    } else { document.getElementById('letterStickerKhung').className = "letter-sticker"; }
                    typeWriter(messages[currentPage], 0);
                }, 400);
            }
        }
        function updateBackCardsPreview() {
            const n1 = (currentPage + 1) % messages.length; const n2 = (currentPage + 2) % messages.length;
            document.getElementById('card2').querySelector('.letter-text').innerText = messages[n1].substring(0, 15) + "..."; document.getElementById('card2').querySelector('.page-number').innerText = `${n1 + 1}/${messages.length}`;
            if(stickers[n1] !== "") { document.getElementById('card2').querySelector('.letter-sticker').className = "letter-sticker active"; document.getElementById('card2').querySelector('.letter-sticker img').src = stickers[n1]; } else { document.getElementById('card2').querySelector('.letter-sticker').className = "letter-sticker"; }
            document.getElementById('card3').querySelector('.letter-text').innerText = messages[n2].substring(0, 15) + "..."; document.getElementById('card3').querySelector('.page-number').innerText = `${n2 + 1}/${messages.length}`;
            if(stickers[n2] !== "") { document.getElementById('card3').querySelector('.letter-sticker').className = "letter-sticker active"; document.getElementById('card3').querySelector('.letter-sticker img').src = stickers[n2]; } else { document.getElementById('card3').querySelector('.letter-sticker').className = "letter-sticker"; }
        }
        function nextPage(event) {
            if (!isOpened || isTyping) return; event.stopPropagation(); document.getElementById('closeBtn').style.display = 'none'; clearTimeout(typingTimeout);
            const frontCard = document.getElementById('card1'); frontCard.style.transform = 'translateX(140px) rotate(10deg)'; frontCard.style.opacity = '0';
            setTimeout(() => {
                currentPage = (currentPage + 1) % messages.length; document.getElementById('pageNumber').innerText = `${currentPage + 1}/${messages.length}`;
                if(stickers[currentPage] !== "") { document.getElementById('letterStickerKhung').className = "letter-sticker active"; document.getElementById('stickerImg').src = stickers[currentPage]; } else { document.getElementById('letterStickerKhung').className = "letter-sticker"; }
                updateBackCardsPreview(); frontCard.style.transform = 'rotate(0deg) scale(1)'; frontCard.style.opacity = '1'; typeWriter(messages[currentPage], 0);
            }, 300);
        }
        function closeEnvelope(event) {
            event.stopPropagation(); clearTimeout(typingTimeout); isOpened = false; currentPage = 0; document.getElementById('closeBtn').style.display = 'none'; document.getElementById('letterContent').innerHTML = ''; document.getElementById('pageNumber').innerText = `1/${messages.length}`; document.getElementById('cardsStack').classList.remove('show'); document.getElementById('envelope').classList.remove('open'); document.getElementById('hintText').innerText = "Chạm vào phong bì để mở quà nha~ 😘";
        }
        function createFloater() {
            const floater = document.createElement('div'); floater.classList.add('bg-heart'); const pool = ['🍓', '🍓', '🍓', '🍓']; floater.innerHTML = pool[Math.floor(Math.random() * pool.length)]; floater.style.left = Math.random() * 100 + 'vw'; floater.style.fontSize = (Math.random() * 12 + 16) + 'px'; floater.style.animationDuration = (Math.random() * 2 + 3.5) + 's'; document.body.appendChild(floater); setTimeout(() => { floater.remove(); }, 4500);
        }
        setInterval(createFloater, 450);
    </script>
</body>
</html>
